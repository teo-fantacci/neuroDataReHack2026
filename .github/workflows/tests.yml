name: tests

# Fast, offline test suite: synthetic data only, no IBL/DANDI downloads, no optional `ssm` env.
# The slow validations (`pytest -m slow`) are run locally.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CI-only: turns each test failure into an annotation on the run / pull request
          pip install pytest-github-actions-annotate-failures==0.4.2

      - name: Run fast tests
        run: pytest -m "not slow" --tb=short
