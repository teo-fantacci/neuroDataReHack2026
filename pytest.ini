[pytest]
testpaths = tests
# Slow tests (full validation sweeps, the optional `ssm` env) are skipped by default.
# Run them with:  pytest -m slow
addopts = -m "not slow" -ra
markers =
    slow: full-size validations or tests needing the optional `ndrh_ssm` env (skipped by default)
filterwarnings =
    ignore::DeprecationWarning
